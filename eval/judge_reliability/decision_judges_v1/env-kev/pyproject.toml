# Fallback for Kev only, used if Kev fails the smoke test under ../env's torch override. Same
# Python and transformers as ../env; torch is the newest Kev allows (<2.9).
[project]
name = "conspiracybench-decision-judges-v1-kev"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.8.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "numpy==2.5.3",
    "huggingface-hub",
    "kev @ git+https://github.com/jaredpalmer/kev.git@5e42a7a03f28134853dd3ff77461457e921e5ec1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
